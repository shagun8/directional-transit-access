name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/build_site.py", "scripts/check_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan before publishing
        run: python scripts/scan_release.py .
      - name: Build (cell layers of the cities in site/held_cities.json are left out)
        run: |
          python scripts/build_site.py --data data --site site --out _site
          python scripts/check_site.py _site --expect-cities 71 --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
