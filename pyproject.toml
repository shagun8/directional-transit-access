[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtaccess"
version = "0.1.0"
description = "Directional transit access: in which compass directions that a car can reach does transit reach nothing?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas>=2.2", "geopandas>=1.0", "shapely>=2.1", "h3>=4", "scipy", "statsmodels", "patsy", "pyarrow",
  "rasterio", "pyogrio",
]

[project.optional-dependencies]
routing = ["r5py==1.1.7"]
test = ["pytest"]

[project.scripts]
dtaccess = "dtaccess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: full routing run from raw inputs (needs Java 21, r5py and downloaded inputs)"]
